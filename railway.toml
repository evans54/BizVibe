[build]
builder = "NIXPACKS"
dockerfilePath = "Dockerfile.simple"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30000
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Non-secret settings only.
# Secrets (DATABASE_URL, REDIS_URL, JWT_SECRET, JWT_REFRESH_SECRET,
# ENCRYPTION_KEY, PGPASSWORD, REDIS_PASSWORD, ...) must be set in the
# Railway dashboard under Variables, never committed to this repo.
[variables]
NODE_ENV = "production"
PORT = "8080"
SMTP_PORT = "587"
SMTP_SECURE = "false"
APP_BASE_URL = "https://bizvibe-production-fc8d.up.railway.app"
BACKUP_DIRECTORY = "./backups"
BACKUP_CRON = "0 2 * * *"
